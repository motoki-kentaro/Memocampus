[package]
name = "memocampus-native-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# Issue #51 Slice B: SQLCipher 4.x (bundled, OpenSSL built from source; needs a native Perl on
# Windows, see docs/secure-vault/slice-b.md). Plain vaults are opened without a key, as before. The
# same feature in all three crates: one binary links exactly one SQLite (`links = "sqlite3"`).
rusqlite = { version = "0.32", features = ["backup", "blob", "bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
regex-syntax = "0.8"
# Pinned: with `data/public_suffix_list.dat`, the registrable domains of `domainWildcard` rules.
publicsuffix = "=2.3.0"
rfd = "0.17"
sha2 = "0.10"
base64 = "0.22"
# Secure Vault key management (Issue #51 Slice B): vault key wrapping and the recovery phrase.
bip39 = { version = "2.2", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
hmac = "0.12"
subtle = "2.6"
zeroize = "1.8"
getrandom = "0.4"
# Issue #51 Slice C: password-protected backups (Argon2id key derivation).
argon2 = "0.5"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console", "Win32_Security_Cryptography"] }
