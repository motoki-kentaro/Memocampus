[package]
name = "memocampus-tray"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace, like mcp-server and visible-store. The tray starts and stops the existing
# `memocampus-mcp` executable; it links neither the MCP server, VisibleStore nor SQLite, and it
# never reads a vault.
[workspace]

[features]
# `cargo test --features no-desktop` on a machine with no desktop session / notification area: the
# tests that start the tray window are then reported as `ignored` instead of failing there. Without
# the feature they run, and fail when no icon can be created.
no-desktop = []

[lib]
name = "memocampus_tray"
path = "src/lib.rs"

[[bin]]
name = "memocampus-tray"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# The tray icon and its menu (Issue #67 Slice 2). `muda` comes with it, re-exported as `tray_icon::menu`.
# Windows only; the Linux backends are not enabled.
tray-icon = { version = "=0.26.1", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
