[package]
name = "memocampus-page-extract"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Text and metadata extraction from Chrome MHTML (Issue #71 S1). Moved from poc/page-fulltext (Slice 1); not yet called by any product code path."

# A standalone crate, like native-host, visible-store, mcp-server and tray: not part of any workspace.
[workspace]

[lib]
name = "page_extract"
path = "src/lib.rs"

[dependencies]
# The dependency set of poc/page-fulltext's extractor, unchanged (versions pinned by Cargo.lock,
# copied from the PoC). SQLite is not a dependency: the index stays out of this crate.
# MIME structure (lenient parser that reports problems; strict checks are ours, src/mime.rs).
# Default features only: its own charset conversion is not used (encoding_rs below decides).
mail-parser = "1.0"
# Charset conversion (WHATWG Encoding Standard labels and decoders).
encoding_rs = "0.8"
# HTML5 tokenizer only (html5ever::tokenizer); its tree builder is not used and no DOM is built.
html5ever = "0.40"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
