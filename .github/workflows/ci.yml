name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (Node 24, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  rust:
    name: Rust (stable MSVC, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # rustup and the MSVC build tools come with the runner image.
      - run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy --no-self-update
      - run: rustup default stable-x86_64-pc-windows-msvc
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
