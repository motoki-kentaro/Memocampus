name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (Node 24, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  rust:
    name: Rust (stable MSVC, Windows)
    runs-on: windows-latest
    # Issue #51 Slice B: SQLCipher with OpenSSL built from source (once for the dev profile and once
    # for release; the three crates share one target directory, so each is built once per job).
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native-host
    env:
      # OpenSSL's MSVC build needs a native (MSWin32) Perl: the runner image's Strawberry Perl. Git
      # for Windows' MSYS Perl does not work (it lacks Locale::Maketext::Simple).
      PERL: C:\Strawberry\perl\bin\perl.exe
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-ci
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # rustup and the MSVC build tools come with the runner image.
      - run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy --no-self-update
      - run: rustup default stable-x86_64-pc-windows-msvc
      - name: Native Perl for the OpenSSL build
        shell: pwsh
        run: |
          $os = & $env:PERL -e 'print $^O'
          if ($os -ne 'MSWin32') { throw "PERL is not a native Windows Perl ($os)" }
          & $env:PERL -v | Select-Object -First 2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: cargo fmt --all -- --check
        working-directory: visible-store
      - run: cargo test --locked
        working-directory: visible-store
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: visible-store
      - run: cargo build --release --locked
        working-directory: visible-store
      - run: cargo fmt --all -- --check
        working-directory: mcp-server
      - run: cargo test --locked
        working-directory: mcp-server
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: mcp-server
      - run: cargo build --release --locked
        working-directory: mcp-server
