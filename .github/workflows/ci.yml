name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Issue #93 S1: a new push to a pull request cancels that pull request's older, still running CI. Pushes to main and
# manual runs get a group of their own (the run id), so they are never cancelled and never wait for one another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  javascript:
    name: JavaScript (Node 24, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  rust:
    name: Rust (stable MSVC, Windows)
    runs-on: windows-latest
    # Issue #51 Slice B: SQLCipher with OpenSSL built from source (once for the dev profile and once
    # for release; the three crates share one target directory, so each is built once per job).
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native-host
    env:
      # OpenSSL's MSVC build needs a native (MSWin32) Perl: the runner image's Strawberry Perl. Git
      # for Windows' MSYS Perl does not work (it lacks Locale::Maketext::Simple).
      PERL: C:\Strawberry\perl\bin\perl.exe
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-ci
      # Issue #93 S2: bump to drop every Rust build cache at once (e.g. one found to be bad).
      RUST_CACHE_VERSION: v1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # rustup and the MSVC build tools come with the runner image.
      - run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy --no-self-update
      - run: rustup default stable-x86_64-pc-windows-msvc
      - name: Native Perl for the OpenSSL build
        shell: pwsh
        run: |
          $os = & $env:PERL -e 'print $^O'
          if ($os -ne 'MSWin32') { throw "PERL is not a native Windows Perl ($os)" }
          & $env:PERL -v | Select-Object -First 2
      # Issue #93 S2: third-party build outputs (OpenSSL, SQLCipher, crates) and the Cargo registry are restored from a
      # cache that only a push to main saves, after every check below has passed. Pull requests only restore. The key
      # names the toolchain and every Cargo input (scripts/ci/rust-cache-key.ps1); if it cannot be made, nothing is
      # restored or saved. A restored cache never skips a check: cargo still builds and tests this repository's crates.
      - name: Rust build cache key
        id: rust-cache-key
        shell: pwsh
        run: ../scripts/ci/rust-cache-key.ps1
      - name: Restore the Rust build cache (exact key only)
        id: rust-cache-restore
        if: steps.rust-cache-key.outputs.cacheable == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          key: ${{ steps.rust-cache-key.outputs.key }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ${{ steps.rust-cache-key.outputs.cargo-home }}\registry\index
            ${{ steps.rust-cache-key.outputs.cargo-home }}\registry\cache
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: cargo fmt --all -- --check
        working-directory: visible-store
      - run: cargo test --locked
        working-directory: visible-store
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: visible-store
      - run: cargo build --release --locked
        working-directory: visible-store
      - run: cargo fmt --all -- --check
        working-directory: mcp-server
      - run: cargo test --locked
        working-directory: mcp-server
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: mcp-server
      - run: cargo build --release --locked
        working-directory: mcp-server
      # Issue #71 S1: the MHTML text extraction library (no SQLite, no executable, not yet called
      # by any product code path).
      - run: cargo fmt --all -- --check
        working-directory: page-extract
      - run: cargo test --locked
        working-directory: page-extract
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: page-extract
      # Issue #67: the Windows tray (no SQLite, no OpenSSL). Its tests start real processes, so they
      # run here and nowhere else.
      - run: cargo fmt --all -- --check
        working-directory: tray
      # A hosted runner may have no desktop / notification area, which the tray-window tests need.
      # With `no-desktop` those tests are reported as `ignored` (counted in the summary), never as
      # passed. The ones that need no desktop (unit, process supervision, registry) all run.
      - run: cargo test --locked --features no-desktop
        working-directory: tray
      # Whether this runner can run the tray-window tests is not confirmed. This step tries them
      # for information only: its result does not gate the build, and a pass here is not claimed
      # anywhere until it has been seen to run.
      - run: cargo test --locked --test ui_process
        working-directory: tray
        continue-on-error: true
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: tray
      - run: cargo build --release --locked
        working-directory: tray
      # Saved only by a push to main whose every step above succeeded (success()), and only when the exact key was not
      # restored (a cache key is immutable). This repository's own crates, test programs and executables are removed
      # first, so the cache holds third-party build outputs only.
      - name: Prune the Rust build cache to third-party outputs (main push only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache-key.outputs.cacheable == 'true' && steps.rust-cache-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: ../scripts/ci/rust-cache-prune.ps1 -TargetDir $env:CARGO_TARGET_DIR
      - name: Save the Rust build cache (main push only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache-key.outputs.cacheable == 'true' && steps.rust-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          key: ${{ steps.rust-cache-key.outputs.key }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ${{ steps.rust-cache-key.outputs.cargo-home }}\registry\index
            ${{ steps.rust-cache-key.outputs.cargo-home }}\registry\cache
