<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="optionsTitle"></title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main id="options" class="options" aria-labelledby="options-title">
      <h1 id="options-title" data-i18n="optionsTitle"></h1>

      <section id="onboarding" class="card" aria-labelledby="onboarding-heading" hidden>
        <h2 id="onboarding-heading" data-i18n="optionsOnboardingHeading"></h2>
        <p data-i18n="optionsOnboardingRecords"></p>
        <p data-i18n="optionsOnboardingLocal"></p>
        <p data-i18n="optionsOnboardingZones"></p>
        <p data-i18n="optionsOnboardingPreset"></p>
        <p data-i18n="optionsOnboardingNotYet"></p>
        <p id="onboarding-vault" class="status" role="status"></p>
        <div class="actions">
          <a href="sidepanel.html#settings" target="_blank" rel="noopener" data-i18n="optionsOpenVaultSettings"></a>
          <button id="vault-recheck" type="button" data-i18n="optionsVaultRecheck"></button>
        </div>
      </section>

      <section class="card" aria-labelledby="active-heading">
        <h2 id="active-heading" tabindex="-1" data-i18n="optionsActiveHeading"></h2>
        <dl class="facts">
          <div><dt data-i18n="optionsStateLabel"></dt><dd><span id="policy-state" class="state" data-state="loading" role="status" aria-live="polite"></span></dd></div>
          <div><dt>Schema / Engine Version</dt><dd id="policy-version"></dd></div>
          <div><dt>Revision</dt><dd id="policy-revision"></dd></div>
        </dl>
        <p id="policy-explanation" class="explanation" aria-live="polite"></p>
        <div class="actions">
          <button id="reload" type="button" data-i18n="optionsReload"></button>
        </div>
        <div id="reload-confirm" class="confirm" role="alertdialog" aria-labelledby="reload-confirm-text" hidden>
          <p id="reload-confirm-text" data-i18n="optionsReloadConfirm"></p>
          <button id="reload-confirm-yes" type="button" data-i18n="optionsReloadDiscard"></button>
          <button id="reload-confirm-no" type="button" data-i18n="optionsCancel"></button>
        </div>
      </section>

      <section class="card" aria-labelledby="categories-heading" aria-describedby="categories-description">
        <h2 id="categories-heading" data-i18n="optionsBasicProtections"></h2>
        <p id="categories-description" class="explanation" data-i18n="optionsBasicProtectionsNote"></p>
        <p id="categories-note" class="note" hidden></p>
        <ul id="categories" class="categories">
          <li>
            <input id="category-authentication" type="checkbox" aria-describedby="category-authentication-detail category-authentication-note category-authentication-warning">
            <div>
              <label for="category-authentication" data-i18n="optionsCategoryAuthentication"></label>
              <span class="group-tag" data-i18n="policyLayerNeverSave"></span>
              <p id="category-authentication-detail" class="detail" data-i18n="optionsCategoryAuthenticationDetail"></p>
              <p id="category-authentication-note" class="note" hidden></p>
              <p id="category-authentication-warning" class="warning" hidden data-i18n="optionsCategoryAuthenticationWarning"></p>
            </div>
          </li>
          <li>
            <input id="category-credentials" type="checkbox" aria-describedby="category-credentials-detail category-credentials-note category-credentials-warning">
            <div>
              <label for="category-credentials" data-i18n="optionsCategoryCredentials"></label>
              <span class="group-tag" data-i18n="policyLayerNeverSave"></span>
              <p id="category-credentials-detail" class="detail" data-i18n="optionsCategoryCredentialsDetail"></p>
              <p id="category-credentials-note" class="note" hidden></p>
              <p id="category-credentials-warning" class="warning" hidden data-i18n="optionsCategoryCredentialsWarning"></p>
            </div>
          </li>
          <li>
            <input id="category-government" type="checkbox" aria-describedby="category-government-detail category-government-note category-government-warning">
            <div>
              <label for="category-government" data-i18n="optionsCategoryGovernment"></label>
              <span class="group-tag" data-i18n="policyLayerSaveButNoMcp"></span>
              <p id="category-government-detail" class="detail" data-i18n="optionsCategoryGovernmentDetail"></p>
              <p id="category-government-note" class="note" hidden></p>
              <p id="category-government-warning" class="warning" hidden data-i18n="optionsCategoryGovernmentWarning"></p>
            </div>
          </li>
          <li>
            <input id="category-webmail" type="checkbox" aria-describedby="category-webmail-detail category-webmail-note category-webmail-warning">
            <div>
              <label for="category-webmail" data-i18n="optionsCategoryWebmail"></label>
              <span class="group-tag" data-i18n="policyLayerSaveButNoMcp"></span>
              <p id="category-webmail-detail" class="detail" data-i18n="optionsCategoryWebmailDetail"></p>
              <p id="category-webmail-note" class="note" hidden></p>
              <p id="category-webmail-warning" class="warning" hidden data-i18n="optionsCategoryWebmailWarning"></p>
            </div>
          </li>
          <li>
            <input id="category-aiChats" type="checkbox" aria-describedby="category-aiChats-detail category-aiChats-note category-aiChats-warning">
            <div>
              <label for="category-aiChats" data-i18n="optionsCategoryAiChats"></label>
              <span class="group-tag" data-i18n="policyLayerSaveButNoMcp"></span>
              <p id="category-aiChats-detail" class="detail" data-i18n="optionsCategoryAiChatsDetail"></p>
              <p id="category-aiChats-note" class="note" hidden></p>
              <p id="category-aiChats-warning" class="warning" hidden data-i18n="optionsCategoryAiChatsWarning"></p>
            </div>
          </li>
        </ul>
      </section>

      <section id="checker" class="card" aria-labelledby="checker-heading" aria-describedby="checker-description">
        <h2 id="checker-heading" tabindex="-1" data-i18n="optionsCheckerHeading"></h2>
        <p id="checker-description" class="explanation"></p>
        <p id="checker-edit" class="checker-edit" hidden></p>
        <fieldset class="checker-kind">
          <legend data-i18n="optionsRuleKindLegend"></legend>
          <span class="radio"><input id="checker-kind-pattern" type="radio" name="checker-kind" value="pattern" checked disabled><label for="checker-kind-pattern">Pattern</label></span>
          <span class="radio"><input id="checker-kind-regex" type="radio" name="checker-kind" value="regex" disabled><label for="checker-kind-regex">Regex</label></span>
          <span class="radio"><input id="checker-kind-domainWildcard" type="radio" name="checker-kind" value="domainWildcard" disabled><label for="checker-kind-domainWildcard">Domain Wildcard</label></span>
          <span class="radio"><input id="checker-kind-exact" type="radio" name="checker-kind" value="exact" disabled><label for="checker-kind-exact">Exact URL</label></span>
        </fieldset>
        <div class="field-head">
          <label for="checker-rule" class="field-label" data-i18n="optionsRuleLabel"></label>
          <button id="checker-help-toggle" type="button" class="help-toggle" data-i18n-aria-label="optionsRuleHelpLabel" aria-expanded="false" aria-controls="checker-help">?</button>
        </div>
        <p id="checker-help" class="help-text" role="note" hidden data-i18n="optionsRuleHelp"></p>
        <p id="checker-kind-note" class="note" hidden data-i18n="optionsDomainWildcardNote"></p>
        <input id="checker-rule" type="text" class="checker-input" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="checker-gate" disabled>
        <label for="checker-url" class="field-label" data-i18n="optionsCheckerUrlLabel"></label>
        <input id="checker-url" type="text" class="checker-input" inputmode="url" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="checker-url-note" disabled>
        <p id="checker-url-note" class="note" data-i18n="optionsCheckerUrlNote"></p>
        <div class="actions">
          <button id="checker-run" type="button" disabled data-i18n="optionsCheckMatch"></button>
        </div>
        <div class="checker-result-box">
          <p class="field-label" id="checker-result-label" data-i18n="optionsCheckerResultLabel"></p>
          <p id="checker-result" class="checker-result" data-result="none" role="status" aria-live="polite" aria-labelledby="checker-result-label" data-i18n="optionsCheckerNotChecked"></p>
          <p id="checker-caveat" class="note" data-i18n="optionsCheckerCaveat"></p>
        </div>
        <div id="checker-approval" class="checker-approval" role="group" aria-labelledby="checker-approval-title" hidden>
          <p id="checker-approval-title" class="confirm-title" data-i18n="optionsPslTitle"></p>
          <p id="checker-approval-reason" class="note"></p>
          <p id="checker-approval-domain" class="approval-domain"></p>
          <p id="checker-approval-effect" class="note" data-i18n="optionsPslEffect"></p>
          <button id="checker-approve" type="button" disabled aria-describedby="checker-approval-reason checker-approval-domain checker-approval-effect" data-i18n="optionsApproveDomain"></button>
        </div>
        <p id="checker-gate" class="note"></p>
        <div id="checker-add" class="checker-targets">
          <div class="checker-target">
            <button id="checker-add-never-save" type="button" disabled aria-describedby="checker-gate checker-never-save-note" data-i18n="optionsAddNeverSave"></button>
            <p id="checker-never-save-note" class="note" hidden></p>
          </div>
          <div class="checker-target">
            <button id="checker-add-save-but-no-mcp" type="button" disabled aria-describedby="checker-gate checker-save-but-no-mcp-note" data-i18n="optionsAddSaveButNoMcp"></button>
            <p id="checker-save-but-no-mcp-note" class="note" hidden></p>
          </div>
        </div>
        <div id="checker-edit-actions" class="actions" hidden>
          <button id="checker-apply-edit" type="button" class="primary" disabled aria-describedby="checker-gate" data-i18n="optionsReplaceRule"></button>
          <button id="checker-cancel-edit" type="button" data-i18n="optionsStopEditing"></button>
        </div>
        <p id="checker-status" class="status" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="card" aria-labelledby="never-save-heading" aria-describedby="never-save-description">
        <h2 id="never-save-heading" tabindex="-1" data-i18n="policyLayerNeverSave"></h2>
        <p id="never-save-description" class="explanation" data-i18n="optionsNeverSaveNote"></p>
        <div class="layer-toggle">
          <input id="never-save-enabled" type="checkbox" aria-describedby="never-save-warning">
          <label for="never-save-enabled" data-i18n="optionsGroupEnable"></label>
        </div>
        <p id="never-save-warning" class="warning" hidden data-i18n="optionsNeverSaveOffWarning"></p>
        <p id="never-save-state" class="note"></p>
        <p id="never-save-error" class="error-text" hidden></p>
        <div id="never-save-table" class="table-wrap">
          <table>
            <caption class="visually-hidden" data-i18n="optionsNeverSaveCaption"></caption>
            <thead><tr><th scope="col" data-i18n="optionsColumnType"></th><th scope="col" data-i18n="optionsRuleLabel"></th><th scope="col" data-i18n="optionsColumnActions"></th></tr></thead>
            <tbody id="never-save-rules"></tbody>
          </table>
        </div>
        <p id="never-save-empty" class="empty" hidden></p>
        <p id="never-save-hint" class="note" hidden data-i18n="optionsGroupHint"></p>
        <p id="never-save-export-note" class="note" data-i18n="optionsNeverSaveExportNote"></p>
        <p id="csv-safety-note" class="warning" data-i18n="optionsCsvSafetyNote"></p>
        <button id="never-save-export" type="button" disabled aria-describedby="never-save-export-note csv-safety-note" data-i18n="optionsNeverSaveExport"></button>
        <p id="never-save-export-status" role="status" aria-live="polite" hidden></p>
        <p id="never-save-import-note" class="note" data-i18n="optionsNeverSaveImportNote"></p>
        <button id="never-save-import" type="button" disabled aria-describedby="never-save-import-note csv-import-limits" data-i18n="optionsNeverSaveImport"></button>
        <input id="never-save-import-file" type="file" accept=".csv,text/csv" data-i18n-aria-label="optionsNeverSaveImportFile" hidden>
        <p id="never-save-import-status" role="status" aria-live="polite" hidden></p>
        <p id="csv-import-limits" class="note" data-i18n="optionsCsvImportLimits"></p>
      </section>

      <section class="card" aria-labelledby="save-but-no-mcp-heading" aria-describedby="save-but-no-mcp-description">
        <h2 id="save-but-no-mcp-heading" tabindex="-1" data-i18n="policyLayerSaveButNoMcp"></h2>
        <p id="save-but-no-mcp-description" class="explanation" data-i18n="optionsSaveButNoMcpNote"></p>
        <div class="layer-toggle">
          <input id="save-but-no-mcp-enabled" type="checkbox" aria-describedby="save-but-no-mcp-warning">
          <label for="save-but-no-mcp-enabled" data-i18n="optionsGroupEnable"></label>
        </div>
        <p id="save-but-no-mcp-warning" class="warning" hidden data-i18n="optionsSaveButNoMcpOffWarning"></p>
        <p id="save-but-no-mcp-state" class="note"></p>
        <p id="save-but-no-mcp-error" class="error-text" hidden></p>
        <div id="save-but-no-mcp-table" class="table-wrap">
          <table>
            <caption class="visually-hidden" data-i18n="optionsSaveButNoMcpCaption"></caption>
            <thead><tr><th scope="col" data-i18n="optionsColumnType"></th><th scope="col" data-i18n="optionsRuleLabel"></th><th scope="col" data-i18n="optionsColumnActions"></th></tr></thead>
            <tbody id="save-but-no-mcp-rules"></tbody>
          </table>
        </div>
        <p id="save-but-no-mcp-empty" class="empty" hidden></p>
        <p id="save-but-no-mcp-hint" class="note" hidden data-i18n="optionsGroupHint"></p>
        <p id="save-but-no-mcp-export-note" class="note" data-i18n="optionsSaveButNoMcpExportNote"></p>
        <p id="private-csv-safety-note" class="warning" data-i18n="optionsPrivateCsvSafetyNote"></p>
        <button id="save-but-no-mcp-export" type="button" disabled aria-describedby="save-but-no-mcp-export-note private-csv-safety-note" data-i18n="optionsSaveButNoMcpExport"></button>
        <p id="save-but-no-mcp-export-status" role="status" aria-live="polite" hidden></p>
        <p id="save-but-no-mcp-import-note" class="note" data-i18n="optionsSaveButNoMcpImportNote"></p>
        <button id="save-but-no-mcp-import" type="button" disabled aria-describedby="save-but-no-mcp-import-note csv-import-limits" data-i18n="optionsSaveButNoMcpImport"></button>
        <input id="save-but-no-mcp-import-file" type="file" accept=".csv,text/csv" data-i18n-aria-label="optionsSaveButNoMcpImportFile" hidden>
        <p id="save-but-no-mcp-import-status" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="card" aria-labelledby="url-test-heading" aria-describedby="url-test-description">
        <h2 id="url-test-heading" data-i18n="optionsUrlTestHeading"></h2>
        <p id="url-test-description" class="explanation" data-i18n="optionsUrlTestNote"></p>
        <label for="test-url" class="field-label" data-i18n="optionsUrlTestLabel"></label>
        <div class="test-url-controls">
          <input id="test-url" type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="test-url-note" disabled>
          <button id="test-url-run" type="button" disabled data-i18n="optionsUrlTestRun"></button>
        </div>
        <p id="test-url-note" class="note" data-i18n="optionsUrlTestPrivacy"></p>
        <div id="test-url-result" class="test-result" hidden>
          <p id="test-url-decision" class="decision" role="status" aria-live="polite"></p>
          <p id="test-url-caveat" class="note" hidden data-i18n="optionsUrlTestCaveat"></p>
        </div>
      </section>

      <section id="approvals" class="card" aria-labelledby="approvals-heading" aria-describedby="approvals-description">
        <h2 id="approvals-heading" data-i18n="optionsApprovalsHeading"></h2>
        <p id="approvals-description" class="explanation" data-i18n="optionsApprovalsNote"></p>
        <p id="approvals-psl" class="note"></p>
        <p id="approvals-state" class="note" role="status" aria-live="polite"></p>
        <ul id="approvals-list" class="approvals-list"></ul>
        <p id="approvals-status" class="status" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="card planned" aria-labelledby="manage-heading">
        <h2 id="manage-heading" data-i18n="optionsManageHeading"></h2>
        <ul class="planned-list">
          <li data-i18n="optionsPlannedMigration"></li>
          <li data-i18n="optionsPlannedRecovery"></li>
        </ul>
      </section>
    </main>

    <footer class="apply-bar" data-i18n-aria-label="optionsApplyBarLabel">
      <p id="dirty-status" class="dirty-status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="validate" type="button" disabled data-i18n="optionsValidate"></button>
        <button id="discard" type="button" disabled data-i18n="optionsDiscard"></button>
        <button id="apply" type="button" class="primary" disabled aria-describedby="apply-reason" data-i18n="optionsApply"></button>
        <button id="start-recording" type="button" class="primary" disabled hidden aria-describedby="onboarding-heading apply-reason" data-i18n="optionsStartRecording"></button>
        <button id="start-recheck" type="button" hidden data-i18n="optionsStartRecheck"></button>
      </div>
      <p id="apply-reason" class="note"></p>
      <p id="validation-status" class="status" role="status" aria-live="polite" hidden></p>
      <p id="apply-status" class="status" role="status" aria-live="polite" tabindex="-1" hidden></p>
      <div class="actions">
        <button id="apply-recheck" type="button" hidden data-i18n="optionsApplyRecheck"></button>
      </div>
      <div id="relax-confirm" class="confirm" role="alertdialog" aria-labelledby="relax-confirm-title" aria-describedby="relax-confirm-text" hidden>
        <p id="relax-confirm-title" class="confirm-title" data-i18n="optionsRelaxTitle"></p>
        <p id="relax-confirm-text" data-i18n="optionsRelaxText"></p>
        <ul id="relax-confirm-list" class="relax-list"></ul>
        <p class="note" data-i18n="optionsRelaxNote"></p>
        <button id="relax-confirm-no" type="button" data-i18n="optionsRelaxCancel"></button>
        <button id="relax-confirm-yes" type="button" data-i18n="optionsRelaxApply"></button>
      </div>
    </footer>
    <script src="i18n-dom.js"></script>
    <script type="module" src="options.js"></script>
  </body>
</html>
