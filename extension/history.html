<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memocampus History</title>
    <link rel="stylesheet" href="history.css">
  </head>
  <body>
    <header class="history-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </span>
        <div class="brand-titles">
          <h1>Memocampus History</h1>
          <span class="brand-tag">閲覧記憶タイムライン</span>
        </div>
      </div>
      <p id="history-status" class="history-status" role="status" aria-live="polite" hidden></p>
    </header>

    <div class="history-layout">
      <aside class="history-side" aria-label="日付と検索条件">
        <section class="calendar" aria-label="カレンダー">
          <div class="calendar-head">
            <button id="cal-prev" type="button" class="icon-button cal-nav cal-prev" aria-label="前の月" title="前の月">◀</button>
            <button id="cal-title" type="button" class="calendar-title" aria-label="年と月を選ぶ" aria-expanded="false" aria-live="polite"></button>
            <button id="cal-next" type="button" class="icon-button cal-nav cal-next" aria-label="次の月" title="次の月">▶</button>
          </div>
          <table id="cal-table" class="cal-table" aria-label="日付の一覧"></table>
          <div id="cal-months" class="calendar-months" hidden></div>
          <button id="cal-jump" type="button" class="link-button cal-jump-button" hidden>選択中の日の月へ戻る</button>
          <p id="cal-status" class="note" role="status" hidden></p>
          <p id="cal-legend" class="note cal-legend"><span class="cal-dot-sample" aria-hidden="true"></span> 記録のある日（現在のドメイン条件に一致）</p>
        </section>

        <section class="domain-filter" aria-labelledby="domain-label">
          <div class="filter-header">
            <label id="domain-label" for="domain-input">ドメイン絞り込み</label>
          </div>
          <div class="search-input-wrap">
            <input id="domain-input" type="search" maxlength="256" placeholder="未入力ならすべてのドメイン" autocomplete="off" spellcheck="false" aria-describedby="domain-hint domain-error">
          </div>
          <fieldset class="mode-switch">
            <legend>照合方法</legend>
            <div class="segmented-control">
              <label class="segmented-item"><input id="mode-exact" type="radio" name="mode" value="exact" checked> <span>完全一致</span></label>
              <label class="segmented-item"><input id="mode-regex" type="radio" name="mode" value="regex"> <span>正規表現</span></label>
            </div>
          </fieldset>
          <p id="domain-hint" class="note"></p>
          <p id="domain-error" class="field-error" role="alert" hidden></p>
        </section>
      </aside>

      <main class="history-main">
        <div class="list-head">
          <div class="list-head-info">
            <h2 id="selected-heading" tabindex="-1"></h2>
            <p id="result-count" class="note result-count-badge" role="status" aria-live="polite"></p>
          </div>
          <label class="size-label">表示件数
            <select id="size-select">
              <option value="25">25件</option>
              <option value="50" selected>50件</option>
              <option value="100">100件</option>
            </select>
          </label>
        </div>
        <div id="history-state" class="state-panel">
          <p id="history-state-text" role="status"></p>
          <button id="history-retry" type="button" hidden>再読み込み</button>
          <button id="history-settings" type="button" hidden>Vault設定を開く</button>
        </div>
        <ol id="history-list" class="visit-list" aria-labelledby="selected-heading" hidden></ol>
        <nav id="history-pager" class="pager" aria-label="ページ" hidden></nav>
      </main>
    </div>
    <script type="module" src="history.js"></script>
  </body>
</html>
