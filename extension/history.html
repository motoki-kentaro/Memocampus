<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memocampus History</title>
    <link rel="stylesheet" href="history.css">
  </head>
  <body>
    <header class="history-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </span>
        <div class="brand-titles">
          <h1>Memocampus History</h1>
          <span class="brand-tag" data-i18n="historyBrandTag"></span>
        </div>
      </div>
      <p id="history-status" class="history-status" role="status" aria-live="polite" hidden></p>
    </header>

    <div class="history-layout">
      <aside class="history-side" data-i18n-aria-label="historySideLabel">
        <section class="calendar" data-i18n-aria-label="historyCalendarLabel">
          <div class="calendar-head">
            <button id="cal-prev" type="button" class="icon-button cal-nav cal-prev" data-i18n-aria-label="calendarPrevMonth" data-i18n-title="calendarPrevMonth">◀</button>
            <button id="cal-title" type="button" class="calendar-title" data-i18n-aria-label="historyChooseMonth" aria-expanded="false" aria-live="polite"></button>
            <button id="cal-next" type="button" class="icon-button cal-nav cal-next" data-i18n-aria-label="calendarNextMonth" data-i18n-title="calendarNextMonth">▶</button>
          </div>
          <table id="cal-table" class="cal-table" data-i18n-aria-label="historyDaysLabel"></table>
          <div id="cal-months" class="calendar-months" hidden></div>
          <button id="cal-jump" type="button" class="link-button cal-jump-button" hidden data-i18n="historyJumpToSelected"></button>
          <p id="cal-status" class="note" role="status" hidden></p>
          <p id="cal-legend" class="note cal-legend"><span class="cal-dot-sample" aria-hidden="true"></span> <span data-i18n="historyCalendarLegend"></span></p>
        </section>

        <section class="domain-filter" aria-labelledby="domain-label">
          <div class="filter-header">
            <label id="domain-label" for="domain-input" data-i18n="historyDomainLabel"></label>
          </div>
          <div class="search-input-wrap">
            <input id="domain-input" type="search" maxlength="256" data-i18n-placeholder="historyDomainPlaceholder" autocomplete="off" spellcheck="false" aria-describedby="domain-hint domain-error">
          </div>
          <fieldset class="mode-switch">
            <legend data-i18n="historyMatchLegend"></legend>
            <div class="segmented-control">
              <label class="segmented-item"><input id="mode-exact" type="radio" name="mode" value="exact" checked> <span data-i18n="historyMatchExact"></span></label>
              <label class="segmented-item"><input id="mode-regex" type="radio" name="mode" value="regex"> <span data-i18n="historyMatchRegex"></span></label>
            </div>
          </fieldset>
          <p id="domain-hint" class="note"></p>
          <p id="domain-error" class="field-error" role="alert" hidden></p>
        </section>
      </aside>

      <main class="history-main">
        <div class="list-head">
          <div class="list-head-info">
            <h2 id="selected-heading" tabindex="-1"></h2>
            <p id="result-count" class="note result-count-badge" role="status" aria-live="polite"></p>
          </div>
          <label class="size-label"><span data-i18n="historyPageSizeLabel"></span>
            <select id="size-select">
              <option value="25" data-i18n="historyPageSize25"></option>
              <option value="50" selected data-i18n="historyPageSize50"></option>
              <option value="100" data-i18n="historyPageSize100"></option>
            </select>
          </label>
        </div>
        <div id="history-state" class="state-panel">
          <p id="history-state-text" role="status"></p>
          <button id="history-retry" type="button" hidden data-i18n="calendarReload"></button>
          <button id="history-settings" type="button" hidden data-i18n="panelOpenVaultSettings"></button>
        </div>
        <ol id="history-list" class="visit-list" aria-labelledby="selected-heading" hidden></ol>
        <nav id="history-pager" class="pager" data-i18n-aria-label="historyPagerLabel" hidden></nav>
      </main>
    </div>
    <script src="i18n-dom.js"></script>
    <script type="module" src="history.js"></script>
  </body>
</html>
