<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memocampus</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <div class="tablist" role="tablist" aria-label="Memocampus">
      <button id="tab-url" class="tab" type="button" role="tab" aria-selected="true" aria-controls="panel-url">URL</button>
      <button id="tab-image" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-image" tabindex="-1">Image</button>
      <button id="tab-page" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-page" tabindex="-1">Page<span id="page-new-dot" class="tab-attention" aria-hidden="true" hidden></span></button>
      <button id="tab-settings" class="tab tab-icon-only" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1" data-i18n-aria-label="panelSettings" data-i18n-title="panelSettings">
        <span class="tab-icon tab-icon-settings" aria-hidden="true"></span>
        <span id="settings-attention" class="tab-attention" aria-hidden="true" hidden></span>
      </button>
    </div>

    <section id="panel-url" class="tabpanel tabpanel-url" role="tabpanel" aria-labelledby="tab-url">
      <header class="toolbar">
        <input id="query" type="search" maxlength="200" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchLabel" autocomplete="off" spellcheck="false">
        <div class="toolbar-row">
          <span class="toolbar-start">
            <button id="visit-calendar-open" type="button" class="calendar-button" data-i18n-aria-label="calendarFilterByDate" data-i18n-title="calendarFilterByDate" aria-haspopup="dialog" aria-expanded="false" aria-controls="visit-calendar" disabled>
              <svg class="calendar-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" fill="none" stroke="currentColor"/><path d="M1.5 6h13M5 1v3M11 1v3" stroke="currentColor"/><rect x="4" y="8" width="2" height="2" fill="currentColor"/><rect x="7" y="8" width="2" height="2" fill="currentColor"/><rect x="10" y="8" width="2" height="2" fill="currentColor"/><rect x="4" y="11" width="2" height="2" fill="currentColor"/></svg>
            </button>
            <span id="visit-date-chip" class="tag-chip is-filter date-chip" hidden>
              <span id="visit-date-chip-text" class="tag-chip-name"></span>
              <button id="visit-date-clear" type="button" class="tag-chip-remove" data-i18n-aria-label="dateFilterClear" data-i18n-title="dateFilterClear">×</button>
            </span>
            <span id="summary" class="summary" role="status" aria-live="polite"></span>
          </span>
          <span class="toolbar-buttons">
            <button id="open-history" type="button" class="secondary" data-i18n-title="panelOpenHistoryTitle" data-i18n-aria-label="panelOpenHistoryLabel">History</button>
            <button id="record-tabs" type="button" class="secondary" data-i18n="panelRecordTabs"></button>
          </span>
        </div>
        <div id="record-status" class="record-status" role="status" hidden></div>
        <div id="queue-status" class="record-status" role="status" hidden></div>
        <div class="toolbar-row toolbar-delete">
          <button id="url-delete-all" type="button" class="danger-button" aria-haspopup="dialog" aria-controls="item-delete-dialog" hidden><span class="danger-icon" aria-hidden="true"></span><span class="danger-label"></span></button>
        </div>
        <div id="url-item-status" class="record-status" role="status" aria-live="polite" hidden></div>
        <div id="policy-status" class="policy-status" role="alert" hidden>
          <p id="policy-message"></p>
          <button id="policy-initialize" type="button" hidden data-i18n="panelPolicyInitialize"></button>
          <button id="policy-recheck" type="button" class="secondary" data-i18n="panelPolicyRecheck"></button>
        </div>
        <section id="visit-calendar" class="visit-calendar" role="dialog" data-i18n-aria-label="calendarFilterByDate" tabindex="-1" hidden></section>
      </header>
      <main id="url-scroll" class="url-scroll">
        <div id="error" class="error" role="alert" hidden>
          <p id="error-message"></p>
          <button id="retry" type="button" data-i18n="panelRetry"></button>
          <button id="open-vault-settings" type="button" hidden data-i18n="panelOpenVaultSettings"></button>
        </div>
        <p id="empty" class="empty" hidden></p>
        <ul id="results" class="results" data-i18n-aria-label="searchResultsLabel"></ul>
        <button id="load-more" type="button" class="load-more" hidden data-i18n="searchLoadMore"></button>
      </main>
    </section>

    <section id="panel-image" class="tabpanel tabpanel-image" role="tabpanel" aria-labelledby="tab-image" tabindex="0" hidden>
      <div class="gallery-toolbar">
        <span class="gallery-toolbar-start">
          <button id="gallery-tag-filter" type="button" class="secondary" aria-haspopup="dialog" aria-controls="gallery-tag-picker" disabled data-i18n="imageFilterByTag"></button>
          <span id="gallery-filter" class="tag-chip is-filter" hidden>
            <span id="gallery-filter-name" class="tag-chip-name"></span>
            <button id="gallery-filter-clear" type="button" class="tag-chip-remove" data-i18n-aria-label="imageFilterClear" data-i18n-title="imageFilterClear">×</button>
          </span>
          <span id="gallery-summary" class="summary" role="status" aria-live="polite"></span>
        </span>
        <button id="gallery-refresh" type="button" class="icon-button" data-i18n-aria-label="imageRefresh" data-i18n-title="imageRefresh">
          <span class="button-icon icon-cached" aria-hidden="true"></span>
          <span id="gallery-new-dot" class="new-dot" aria-hidden="true" hidden></span>
        </button>
      </div>
      <div class="gallery-bulk">
        <button id="gallery-delete-all" type="button" class="danger-button" aria-haspopup="dialog" aria-controls="item-delete-dialog" hidden><span class="danger-icon" aria-hidden="true"></span><span class="danger-label"></span></button>
      </div>
      <p id="gallery-status" class="gallery-status" role="status" aria-live="polite"></p>
      <div id="gallery-error" class="error" role="alert" hidden>
        <p id="gallery-error-message"></p>
        <button id="gallery-retry" type="button" data-i18n="panelRetry"></button>
        <button id="gallery-open-settings" type="button" hidden data-i18n="panelOpenVaultSettings"></button>
      </div>
      <p id="gallery-empty" class="empty" hidden></p>
      <ul id="gallery-grid" class="gallery-grid" data-i18n-aria-label="imageGridLabel"></ul>
      <button id="gallery-more" type="button" class="load-more" hidden data-i18n="imageLoadMore"></button>
      <section id="gallery-details" class="gallery-details" aria-labelledby="gallery-details-title" tabindex="-1" hidden>
        <div class="gallery-details-head">
          <h2 id="gallery-details-title" data-i18n="imageDetailsTitle"></h2>
          <button id="gallery-details-close" type="button" class="secondary" data-i18n="imageClose"></button>
        </div>
        <p id="gallery-details-meta" class="vault-meta"></p>
        <section class="gallery-tags" aria-labelledby="gallery-tags-title">
          <h3 id="gallery-tags-title" data-i18n="imageTagsHeading"></h3>
          <ul id="gallery-tags" class="tag-list" data-i18n-aria-label="imageTagsLabel"></ul>
          <p id="gallery-tags-empty" class="vault-meta" hidden data-i18n="imageTagsEmpty"></p>
          <div class="tag-form">
            <input id="gallery-tag-input" type="text" maxlength="200" data-i18n-placeholder="imageTagPlaceholder" data-i18n-aria-label="imageTagInputLabel" autocomplete="off" spellcheck="false" disabled>
            <button id="gallery-tag-add" type="button" disabled data-i18n="imageTagAdd"></button>
            <button id="gallery-tag-choose" type="button" class="secondary" aria-haspopup="dialog" aria-controls="gallery-tag-picker" disabled data-i18n="imageChooseTag"></button>
          </div>
          <p id="gallery-tags-message" class="gallery-tags-message" role="status" aria-live="polite"></p>
        </section>
        <section id="gallery-manage-section" class="gallery-manage" aria-labelledby="gallery-manage-title" hidden>
          <h3 id="gallery-manage-title" data-i18n="imageManageHeading"></h3>
          <select id="gallery-manage" class="item-action" data-i18n-aria-label="imageManageLabel" aria-describedby="gallery-manage-note" disabled>
            <option value="" selected data-i18n="rowChooseAction"></option>
            <option value="never_save" data-i18n="policyActionNeverSave"></option>
            <option value="save_but_no_mcp" data-i18n="policyActionSaveButNoMcp"></option>
            <option value="publish" data-i18n="policyActionPublish"></option>
          </select>
          <p id="gallery-manage-note" class="vault-meta" role="status" aria-live="polite"></p>
        </section>
        <h3 class="gallery-sources-title" data-i18n="imageSourcesHeading"></h3>
        <ol id="gallery-sources" class="gallery-sources"></ol>
        <button id="gallery-sources-more" type="button" class="secondary" hidden data-i18n="imageShowMore"></button>
      </section>
      <section id="gallery-tag-picker" class="tag-picker" role="dialog" aria-labelledby="gallery-tag-picker-title" tabindex="-1" hidden>
        <div class="gallery-details-head">
          <h2 id="gallery-tag-picker-title" data-i18n="imageFilterByTag"></h2>
          <button id="gallery-tag-picker-close" type="button" class="secondary" data-i18n="imageClose"></button>
        </div>
        <div id="gallery-tag-picker-form" class="tag-form">
          <input id="gallery-tag-picker-input" type="text" maxlength="200" data-i18n-placeholder="imageTagNamePlaceholder" data-i18n-aria-label="imageTagFilterLabel" autocomplete="off" spellcheck="false">
          <button id="gallery-tag-picker-apply" type="button" data-i18n="imageTagApply"></button>
        </div>
        <p id="gallery-tag-picker-message" class="gallery-tags-message" role="status" aria-live="polite"></p>
        <ul id="gallery-tag-picker-list" class="tag-list tag-options" data-i18n-aria-label="imageTagListLabel"></ul>
        <button id="gallery-tag-picker-more" type="button" class="secondary" hidden data-i18n="imageShowMore"></button>
      </section>
      <div id="gallery-menu" class="context-menu" role="menu" data-i18n-aria-label="imageMenuLabel" hidden>
        <button id="gallery-menu-copy" type="button" role="menuitem" tabindex="-1" data-i18n="imageMenuCopy"></button>
        <button id="gallery-menu-export" type="button" role="menuitem" tabindex="-1" data-i18n="imageMenuExport"></button>
      </div>
    </section>

    <section id="panel-page" class="tabpanel" role="tabpanel" aria-labelledby="tab-page" hidden>
      <header class="toolbar">
        <input id="page-query" type="search" maxlength="200" autocomplete="off" spellcheck="false">
        <div class="toolbar-row">
          <span id="page-status" class="summary" role="status" aria-live="polite"></span>
          <button id="page-refresh" type="button" class="secondary"></button>
        </div>
        <button id="page-delete-filter" type="button" class="danger-button" disabled aria-haspopup="dialog" aria-controls="page-delete-dialog"><span class="danger-icon" aria-hidden="true"></span><span class="danger-label"></span></button>
      </header>
      <p id="page-note" class="vault-meta"></p>
      <p id="page-open-note" class="vault-meta"></p>
      <p id="page-error" class="error" role="alert" hidden></p>
      <ol id="page-groups" class="page-groups"></ol>
      <button id="page-more" type="button" class="secondary" hidden></button>
      <dialog id="page-delete-dialog" class="page-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="page-delete-title" aria-describedby="page-delete-description" hidden>
        <h2 id="page-delete-title"></h2>
        <div id="page-delete-description"></div>
        <div class="toolbar-row">
          <button id="page-delete-cancel" type="button" class="secondary"></button>
          <button id="page-delete-confirm" type="button" class="danger-button" disabled><span class="danger-icon" aria-hidden="true"></span><span class="danger-label"></span></button>
        </div>
      </dialog>
    </section>

    <dialog id="item-delete-dialog" class="page-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="item-delete-title" aria-describedby="item-delete-description" hidden>
      <h2 id="item-delete-title"></h2>
      <div id="item-delete-description"></div>
      <p id="item-delete-error" class="item-dialog-error" role="alert" hidden></p>
      <div class="toolbar-row">
        <button id="item-delete-cancel" type="button" class="secondary"></button>
        <button id="item-delete-confirm" type="button" class="danger-button" disabled><span class="danger-icon" aria-hidden="true"></span><span class="danger-label"></span></button>
      </div>
    </dialog>

    <section id="panel-settings" class="tabpanel" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <section id="vault-panel" class="vault-panel" aria-labelledby="vault-heading">
        <h2 id="vault-heading">Vault</h2>
        <p id="vault-state" class="vault-state"></p>
        <p id="vault-path" class="vault-path" hidden></p>
        <p id="vault-counts" class="vault-meta" hidden></p>
        <div id="vault-location" class="vault-location" hidden>
          <p id="vault-verdict"></p>
          <ul id="vault-reasons"></ul>
        </div>
        <div id="vault-publication" class="vault-publication" hidden>
          <p id="vault-publication-state" class="vault-publication-state"></p>
          <p id="vault-publication-note" class="vault-meta"></p>
          <button id="vault-publication-confirm" type="button" data-i18n="vaultPublicationConfirmButton" hidden></button>
          <button id="vault-publication-revoke" type="button" data-i18n="vaultPublicationRevokeButton" hidden></button>
          <div id="vault-publication-review" class="vault-approval" role="alertdialog" aria-labelledby="vault-publication-review-title" hidden>
            <p id="vault-publication-review-title"></p>
            <button id="vault-publication-approve" type="button" data-i18n="vaultPublicationApproveButton"></button>
            <button id="vault-publication-cancel" type="button" data-i18n="vaultCancelButton"></button>
          </div>
        </div>
        <div id="vault-creation-pending" class="vault-approval" role="alert" hidden>
          <p id="vault-creation-pending-text"></p>
          <button id="vault-creation-discard" type="button" data-i18n="vaultCreationDiscardButton"></button>
        </div>
        <div id="vault-recovery-offer" class="vault-recovery-offer" hidden>
          <button id="vault-recovery-start" type="button" data-i18n="vaultRecoveryStartButton"></button>
        </div>
        <fieldset id="vault-encryption" class="vault-encryption">
          <legend data-i18n="vaultNewVaultLegend"></legend>
          <label><input id="vault-encryption-encrypted" type="radio" name="vault-encryption" value="encrypted" checked> <span data-i18n="vaultEncryptChoice"></span></label>
          <label><input id="vault-encryption-plain" type="radio" name="vault-encryption" value="plain"> <span data-i18n="vaultPlainChoice"></span></label>
          <p id="vault-encryption-note" class="vault-meta"></p>
        </fieldset>
        <fieldset id="vault-backup-options" class="vault-encryption">
          <legend data-i18n="vaultBackupLegend"></legend>
          <label><input id="vault-backup-normal" type="radio" name="vault-backup-protection" value="normal" checked> <span data-i18n="vaultBackupNormalChoice"></span></label>
          <label><input id="vault-backup-password" type="radio" name="vault-backup-protection" value="password"> <span data-i18n="vaultBackupPasswordChoice"></span></label>
          <p id="vault-backup-note" class="vault-meta"></p>
          <div id="vault-backup-password-fields" class="vault-secret-fields" hidden>
            <label><span data-i18n="vaultPasswordLabel"></span> <input id="vault-backup-password-input" type="password" autocomplete="new-password" spellcheck="false"></label>
            <label><span data-i18n="vaultPasswordConfirmLabel"></span> <input id="vault-backup-password-confirm" type="password" autocomplete="new-password" spellcheck="false"></label>
            <p id="vault-backup-password-note" class="vault-meta"></p>
          </div>
          <div id="vault-backup-spell-row" class="vault-secret-fields" hidden>
            <label><span data-i18n="vaultSpellInputLabel"></span> <input id="vault-backup-spell" class="vault-spell-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" translate="no"></label>
            <p id="vault-backup-spell-note" class="vault-meta"></p>
          </div>
        </fieldset>
        <div class="vault-actions">
          <button id="vault-create-default" type="button" data-i18n="vaultCreateDefaultButton"></button>
          <p id="vault-default-path" class="vault-meta"></p>
          <button id="vault-create-pick" type="button" data-i18n="vaultCreatePickButton"></button>
          <button id="vault-open-pick" type="button" data-i18n="vaultOpenPickButton"></button>
          <button id="vault-backup-pick" type="button" data-i18n="vaultBackupPickButton"></button>
          <button id="vault-restore-pick" type="button" data-i18n="vaultRestorePickButton"></button>
        </div>
        <fieldset id="vault-convert" class="vault-encryption vault-convert" hidden>
          <legend id="vault-convert-title"></legend>
          <p id="vault-convert-note" class="vault-meta"></p>
          <p id="vault-convert-source" class="vault-meta"></p>
          <label id="vault-convert-ack-row" class="vault-convert-ack" hidden><input id="vault-convert-ack" type="checkbox"> <span data-i18n="vaultDecryptAck"></span></label>
          <button id="vault-convert-pick" type="button"></button>
        </fieldset>
        <fieldset id="vault-reissue" class="vault-encryption vault-convert" hidden>
          <legend id="vault-reissue-title"></legend>
          <p id="vault-reissue-note" class="vault-meta"></p>
          <button id="vault-reissue-pick" type="button"></button>
        </fieldset>
        <details class="vault-manual">
          <summary data-i18n="vaultManualSummary"></summary>
          <input id="vault-path-input" type="text" spellcheck="false" autocomplete="off" data-i18n-aria-label="vaultPathInputLabel" placeholder="C:\Users\…\memocampus.sqlite3">
          <div class="vault-manual-actions">
            <button type="button" data-manual="vault_create" data-i18n="vaultManualCreateButton"></button>
            <button type="button" data-manual="vault_open" data-i18n="vaultManualOpenButton"></button>
            <button type="button" data-manual="vault_backup" data-i18n="vaultManualBackupButton"></button>
          </div>
        </details>
        <div id="vault-onboarding" class="vault-approval vault-onboarding" role="alertdialog" aria-labelledby="vault-onboarding-title" hidden>
          <p id="vault-onboarding-title" class="vault-spell-title"></p>
          <p id="vault-spell-lead" class="vault-spell-lead"></p>
          <p id="vault-spell-caution" class="vault-spell-caution"></p>
          <p id="vault-onboarding-path" class="vault-meta"></p>
          <div id="vault-spell-show">
            <code id="vault-spell" class="vault-spell" translate="no"></code>
            <button id="vault-spell-copy" type="button" data-i18n="vaultSpellCopyButton"></button>
            <p id="vault-spell-note" class="vault-meta"></p>
            <button id="vault-spell-written" type="button" data-i18n="vaultSpellWrittenButton"></button>
          </div>
          <div id="vault-spell-check" class="vault-secret-fields" hidden>
            <p id="vault-spell-check-title"></p>
            <label><span data-i18n="vaultSpellInputLabel"></span> <input id="vault-spell-confirm-input" class="vault-spell-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" translate="no"></label>
            <button id="vault-spell-confirm" type="button" data-i18n="vaultSpellConfirmCreate"></button>
            <button id="vault-spell-back" type="button" data-i18n="vaultSpellBackButton"></button>
          </div>
          <button id="vault-onboarding-cancel" type="button" data-i18n="vaultOnboardingCancelCreate"></button>
        </div>
        <div id="vault-recovery" class="vault-approval" role="alertdialog" aria-labelledby="vault-recovery-title" hidden>
          <p id="vault-recovery-title"></p>
          <input id="vault-recovery-input" class="vault-spell-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" translate="no" data-i18n-aria-label="vaultSpellInputLabel">
          <button id="vault-recovery-submit" type="button" data-i18n="vaultRecoverySubmitButton"></button>
          <button id="vault-recovery-cancel" type="button" data-i18n="vaultCancelButton"></button>
        </div>
        <div id="vault-restore" class="vault-approval" role="alertdialog" aria-labelledby="vault-restore-title" hidden>
          <p id="vault-restore-title"></p>
          <div class="vault-secret-fields">
            <label id="vault-restore-password-row" hidden><span data-i18n="vaultRestorePasswordLabel"></span> <input id="vault-restore-password" type="password" autocomplete="off" spellcheck="false"></label>
            <label id="vault-restore-spell-row" hidden><span data-i18n="vaultSpellInputLabel"></span> <input id="vault-restore-spell" class="vault-spell-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" translate="no"></label>
          </div>
          <button id="vault-restore-submit" type="button" data-i18n="vaultRestoreSubmitButton"></button>
          <button id="vault-restore-cancel" type="button" data-i18n="vaultCancelButton"></button>
        </div>
        <div id="vault-restored" class="vault-approval" role="alertdialog" aria-labelledby="vault-restored-title" hidden>
          <p id="vault-restored-title"></p>
          <p id="vault-restored-policy" class="vault-meta"></p>
          <details id="vault-restored-policy-details" hidden>
            <summary data-i18n="vaultPolicyCopyShow"></summary>
            <pre id="vault-restored-policy-json" class="vault-policy-copy"></pre>
          </details>
          <button id="vault-restore-activate" type="button" data-i18n="vaultRestoreActivateButton"></button>
          <button id="vault-restore-discard" type="button" data-i18n="vaultRestoreDiscardButton"></button>
        </div>
        <div id="vault-converted" class="vault-approval" role="alertdialog" aria-labelledby="vault-converted-title" hidden>
          <p id="vault-converted-title"></p>
          <button id="vault-convert-activate" type="button" data-i18n="vaultConvertActivateButton"></button>
          <button id="vault-convert-keep" type="button" data-i18n="vaultConvertKeepButton"></button>
          <button id="vault-convert-discard" type="button" data-i18n="vaultConvertDiscardButton"></button>
        </div>
        <div id="vault-approval" class="vault-approval" role="alertdialog" aria-labelledby="vault-approval-title" hidden>
          <p id="vault-approval-title"></p>
          <ul id="vault-approval-reasons"></ul>
          <button id="vault-approve" type="button" data-i18n="vaultApproveButton"></button>
          <button id="vault-approve-cancel" type="button" data-i18n="vaultCancelButton"></button>
        </div>
        <p id="vault-message" class="vault-message" role="status" aria-live="polite"></p>
        <p class="vault-meta" id="vault-note"></p>
        <p class="vault-meta" data-i18n="vaultSwitchNote"></p>
      </section>
      <section class="vault-panel" aria-labelledby="privacy-heading">
        <h2 id="privacy-heading" data-i18n="panelPrivacyHeading"></h2>
        <p class="vault-meta" data-i18n="panelPrivacyNote"></p>
        <button id="open-privacy-settings" type="button" data-i18n="panelPrivacySettings"></button>
      </section>
    </section>
    <section id="item-dialog" class="item-dialog" role="dialog" aria-labelledby="item-dialog-title" aria-describedby="item-dialog-body" tabindex="-1" hidden>
      <h2 id="item-dialog-title"></h2>
      <p id="item-dialog-target" class="item-dialog-target"></p>
      <fieldset id="item-dialog-urls" class="item-dialog-choice" hidden>
        <legend data-i18n="policyUrlsHeading"></legend>
        <div id="item-dialog-url-list" class="item-dialog-url-list"></div>
      </fieldset>
      <fieldset id="item-dialog-scope" class="item-dialog-choice" hidden>
        <legend data-i18n="policyScopeHeading"></legend>
        <label><input id="item-scope-url" type="radio" name="item-scope" value="url" checked> <span data-i18n="policyScopeUrlOption"></span></label>
        <label><input id="item-scope-host" type="radio" name="item-scope" value="host"> <span data-i18n="policyScopeHostOption"></span></label>
      </fieldset>
      <div id="item-dialog-body" class="item-dialog-body" role="status" aria-live="polite"></div>
      <label id="item-dialog-ack" class="item-dialog-ack" hidden><input id="item-dialog-ack-box" type="checkbox"> <span id="item-dialog-ack-text"></span></label>
      <p id="item-dialog-error" class="item-dialog-error" role="alert" hidden></p>
      <div class="item-dialog-actions">
        <button id="item-dialog-confirm" type="button" disabled></button>
        <button id="item-dialog-repreview" type="button" class="secondary" hidden data-i18n="policyRecheck"></button>
        <button id="item-dialog-settings" type="button" class="secondary" hidden data-i18n="policyOpenPrivacySettings"></button>
        <button id="item-dialog-cancel" type="button" class="secondary" data-i18n="policyCancel"></button>
      </div>
    </section>
    <script src="i18n-dom.js"></script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
